<!DOCTYPE html>
<!-- static/voice.html — Live Connect: phone-call style with configurable silence detection. -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live Connect — Voice Assistant</title>
  <style>
    :root {
      --bg: #0d0d10;
      --surface: #16161c;
      --border: #2a2a32;
      --text: #e8e8ed;
      --muted: #8888a0;
      --accent: #6366f1;
      --accent-hover: #818cf8;
      --recording: #ef4444;
      --success: #22c55e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "DM Sans", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    h1 { font-size: 1.5rem; margin: 0 0 0.5rem; }
    p.sub { color: var(--muted); font-size: 0.9rem; margin: 0 0 2rem; }
    .status {
      min-height: 1.5rem;
      color: var(--muted);
      font-size: 0.85rem;
      margin-bottom: 1rem;
      text-align: center;
    }
    .status.recording { color: var(--recording); }
    .status.speaking { color: var(--accent); }
    .status.success { color: var(--success); }
    .btn {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: 3px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s, border-color 0.15s, background 0.15s;
    }
    .btn:hover { border-color: var(--accent); background: var(--accent); transform: scale(1.02); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    .btn.recording { border-color: var(--recording); background: var(--recording); animation: pulse 1s infinite; }
    .btn.end { width: auto; height: auto; padding: 0.5rem 1rem; border-radius: 24px; font-size: 0.9rem; margin-top: 0.5rem; }
    @keyframes pulse { 50% { opacity: 0.85; } }
    .transcript {
      max-width: 420px;
      width: 100%;
      margin-top: 2rem;
      padding: 1rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      font-size: 0.9rem;
      max-height: 200px;
      overflow-y: auto;
    }
    .transcript .you { color: var(--accent); margin-bottom: 0.5rem; }
    .transcript .agent { color: var(--muted); }
    .links { display: flex; gap: 1rem; margin-top: 1.5rem; flex-wrap: wrap; justify-content: center; }
    a.link { color: var(--muted); font-size: 0.85rem; }
    a.link:hover { color: var(--text); }
  </style>
</head>
<body>
  <h1>Live Connect</h1>
  <p class="sub">Talk to your virtual assistant (phone-call style)</p>
  <div class="status" id="status">Click Start — then you’ll hear the welcome and can speak</div>
  <button type="button" class="btn" id="btn">Start</button>
  <button type="button" class="btn end" id="endBtn" style="display: none;">End call</button>
  <div class="transcript" id="transcript"></div>
  <div class="links">
    <a href="/settings" class="link">Settings</a>
    <a href="/" class="link">← Back to chat</a>
  </div>

  <script>
    const API = window.location.origin;
    const sessionId = "voice-" + Math.random().toString(36).slice(2, 12);
    const statusEl = document.getElementById("status");
    const btnEl = document.getElementById("btn");
    const endBtnEl = document.getElementById("endBtn");
    const transcriptEl = document.getElementById("transcript");

    const STORAGE_KEYS = { silenceSeconds: "voice_silence_seconds", autoResume: "voice_auto_resume" };
    function getSilenceSeconds() { return Math.min(10, Math.max(0.5, parseFloat(localStorage.getItem(STORAGE_KEYS.silenceSeconds)) || 2)); }
    function getAutoResume() { return localStorage.getItem(STORAGE_KEYS.autoResume) !== "false"; }

    function setStatus(msg, className = "") {
      statusEl.textContent = msg;
      statusEl.className = "status" + (className ? " " + className : "");
    }

    let mediaRecorder = null;
    let audioChunks = [];
    let welcomePlayed = false;
    let stream = null;
    let audioContext = null;
    let analyser = null;
    let silenceCheckInterval = null;
    let silenceStartTime = null;
    let hadSpeech = false;
    let inCall = false;
    const VOLUME_THRESHOLD = 0.008;
    const CHECK_MS = 200;
    const MIN_SPEECH_MS = 400;

    function showInCall(show) {
      inCall = show;
      btnEl.style.display = show ? "none" : "block";
      endBtnEl.style.display = show ? "block" : "none";
    }

    function stopSilenceDetection() {
      if (silenceCheckInterval) {
        clearInterval(silenceCheckInterval);
        silenceCheckInterval = null;
      }
      silenceStartTime = null;
      hadSpeech = false;
    }

    function getVolumeLevel() {
      if (!analyser) return 0;
      const data = new Uint8Array(analyser.frequencyBinCount);
      analyser.getByteTimeDomainData(data);
      let sum = 0;
      for (let i = 0; i < data.length; i++) sum += Math.abs((data[i] - 128) / 128);
      return sum / data.length;
    }

    function stopRecordingAndSend() {
      if (!mediaRecorder || mediaRecorder.state === "inactive") return;
      stopSilenceDetection();
      mediaRecorder.stop();
    }

    function startListening() {
      const silenceSeconds = getSilenceSeconds();
      audioChunks = [];
      hadSpeech = false;
      silenceStartTime = null;
      navigator.mediaDevices.getUserMedia({ audio: true }).then((s) => {
        stream = s;
        mediaRecorder = new MediaRecorder(stream);
        mediaRecorder.ondataavailable = (e) => { if (e.data.size) audioChunks.push(e.data); };
        mediaRecorder.onstop = () => {
          stream.getTracks().forEach((t) => t.stop());
          stream = null;
          const blob = new Blob(audioChunks, { type: "audio/webm" });
          handleAudio(blob);
        };
        mediaRecorder.start();
        setStatus("Listening… speak, then pause " + silenceSeconds + "s", "recording");
        btnEl.classList.add("recording");

        try {
          audioContext = new (window.AudioContext || window.webkitAudioContext)();
          const source = audioContext.createMediaStreamSource(s);
          analyser = audioContext.createAnalyser();
          analyser.fftSize = 2048;
          analyser.smoothingTimeConstant = 0.3;
          source.connect(analyser);
        } catch (e) {
          setStatus("Listening… (silence detection unavailable)", "recording");
          return;
        }

        const requiredSilenceChecks = Math.ceil((silenceSeconds * 1000) / CHECK_MS);
        const minSpeechChecks = Math.ceil(MIN_SPEECH_MS / CHECK_MS);
        let speechChecks = 0;
        let silenceChecks = 0;

        silenceCheckInterval = setInterval(() => {
          const vol = getVolumeLevel();
          if (vol > VOLUME_THRESHOLD) {
            hadSpeech = true;
            speechChecks = Math.min(speechChecks + 1, minSpeechChecks);
            silenceChecks = 0;
          } else {
            if (hadSpeech && speechChecks >= minSpeechChecks) {
              silenceChecks++;
              if (silenceChecks >= requiredSilenceChecks) {
                stopRecordingAndSend();
                return;
              }
            }
          }
        }, CHECK_MS);
      }).catch((e) => {
        setStatus("Microphone error: " + e.message);
        showInCall(false);
      });
    }

    function endCall() {
      stopSilenceDetection();
      if (mediaRecorder && mediaRecorder.state !== "inactive") {
        mediaRecorder.stop();
        mediaRecorder = null;
      }
      if (stream) {
        stream.getTracks().forEach((t) => t.stop());
        stream = null;
      }
      btnEl.classList.remove("recording");
      btnEl.textContent = "Start";
      showInCall(false);
      setStatus("Call ended. Click Start to begin again.");
    }

    async function playWelcome() {
      setStatus("Playing welcome…", "speaking");
      try {
        const ctrl = new AbortController();
        const t = setTimeout(() => ctrl.abort(), 35000);
        const r = await fetch(API + "/voice/welcome", { signal: ctrl.signal });
        clearTimeout(t);
        if (!r.ok) throw new Error("Welcome audio failed");
        const blob = await r.blob();
        const url = URL.createObjectURL(blob);
        const audio = new Audio(url);
        await new Promise((resolve, reject) => {
          audio.onended = () => { URL.revokeObjectURL(url); resolve(); };
          audio.onerror = (e) => reject(new Error("Playback failed"));
          audio.play().catch(reject);
        });
        welcomePlayed = true;
        showInCall(true);
        startListening();
      } catch (e) {
        setStatus("Welcome failed: " + (e.message || "Try again."));
      }
    }

    async function handleAudio(blob) {
      btnEl.classList.remove("recording");
      setStatus("Processing…");
      if (!inCall) return;
      try {
        const form = new FormData();
        form.append("file", blob, "audio.webm");
        const sttRes = await fetch(API + "/voice/stt", { method: "POST", body: form });
        if (!sttRes.ok) throw new Error("Speech recognition failed");
        const { text } = await sttRes.json();
        if (!text || !text.trim()) {
          setStatus("No speech detected. Listening again…", "success");
          startListening();
          return;
        }
        addToTranscript("you", text);
        setStatus("Thinking…");
        const chatRes = await fetch(API + "/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ session_id: sessionId, message: text }),
        });
        const chatData = await chatRes.json();
        const reply = chatData.error ? "Sorry, something went wrong." : (chatData.reply || "");
        if (reply) addToTranscript("agent", reply);
        setStatus("Speaking…", "speaking");
        const ttsRes = await fetch(API + "/voice/tts", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text: reply }),
        });
        if (ttsRes.ok) {
          const audioBlob = await ttsRes.blob();
          const url = URL.createObjectURL(audioBlob);
          const audio = new Audio(url);
          await new Promise((resolve) => {
            audio.onended = () => { URL.revokeObjectURL(url); resolve(); };
            audio.onerror = () => resolve();
            audio.play().catch(() => resolve());
          });
        }
        if (inCall && getAutoResume()) {
          setStatus("Listening…", "success");
          startListening();
        } else {
          showInCall(false);
          btnEl.textContent = "Speak";
          setStatus("Tap Speak for your next turn, or End call.", "success");
        }
      } catch (e) {
        setStatus("Error: " + e.message);
        if (inCall && getAutoResume()) startListening();
        else { showInCall(false); btnEl.textContent = "Speak"; }
      }
    }

    function addToTranscript(role, text) {
      const div = document.createElement("div");
      div.className = role;
      div.textContent = (role === "you" ? "You: " : "Agent: ") + text;
      transcriptEl.appendChild(div);
      transcriptEl.scrollTop = transcriptEl.scrollHeight;
    }

    btnEl.addEventListener("click", () => {
      if (!welcomePlayed) {
        btnEl.disabled = true;
        playWelcome().then(() => { btnEl.disabled = false; });
        return;
      }
      if (!inCall && welcomePlayed) {
        showInCall(true);
        startListening();
      }
    });

    endBtnEl.addEventListener("click", endCall);

    window.addEventListener("load", () => {
      btnEl.textContent = "Start";
    });
  </script>
</body>
</html>
