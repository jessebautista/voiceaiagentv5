<!DOCTYPE html>
<!-- static/index.html — Simple chat UI for the AI agent. POSTs to /chat and displays replies. -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Agent — Chat</title>
  <style>
    :root {
      --bg: #0f0f12;
      --surface: #1a1a1f;
      --border: #2a2a32;
      --text: #e8e8ed;
      --muted: #8888a0;
      --accent: #6c5ce7;
      --accent-hover: #7d6ef7;
      --user-bg: #2a2a32;
      --bot-bg: #25252d;
      --error: #e74c3c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "DM Sans", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 1rem 1.5rem;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }
    header h1 { margin: 0; font-size: 1.25rem; font-weight: 600; }
    header p { margin: 0.25rem 0 0; font-size: 0.875rem; color: var(--muted); }
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 1rem 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      max-width: 48rem;
      margin: 0 auto;
      width: 100%;
    }
    .msg {
      padding: 0.75rem 1rem;
      border-radius: 12px;
      max-width: 85%;
      line-height: 1.5;
    }
    .msg.user {
      align-self: flex-end;
      background: var(--user-bg);
      border: 1px solid var(--border);
    }
    .msg.bot {
      align-self: flex-start;
      background: var(--bot-bg);
      border: 1px solid var(--border);
    }
    .msg.error { background: rgba(231,76,60,0.15); border-color: var(--error); color: #f5b7b1; }
    .msg .role { font-size: 0.7rem; text-transform: uppercase; color: var(--muted); margin-bottom: 0.25rem; }
    #form {
      padding: 1rem 1.5rem;
      border-top: 1px solid var(--border);
      background: var(--surface);
    }
    #form form {
      max-width: 48rem;
      margin: 0 auto;
      display: flex;
      gap: 0.5rem;
    }
    #input {
      flex: 1;
      padding: 0.75rem 1rem;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--bg);
      color: var(--text);
      font-size: 1rem;
    }
    #input:focus { outline: none; border-color: var(--accent); }
    button[type="submit"] {
      padding: 0.75rem 1.25rem;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
    }
    button[type="submit"]:hover { background: var(--accent-hover); }
    button[type="submit"]:disabled { opacity: 0.6; cursor: not-allowed; }
    .typing { color: var(--muted); font-style: italic; }
  </style>
</head>
<body>
  <header>
    <h1>AI Agent — Receptionist</h1>
    <p>Ask about hours, contact, bookings, or use the calculator.</p>
  </header>
  <main id="messages"></main>
  <section id="form">
    <form id="chat-form">
      <input id="input" type="text" placeholder="Type a message..." autocomplete="off" />
      <button type="submit">Send</button>
    </form>
  </section>
  <script>
    const API_BASE = window.location.origin;
    const sessionId = "session-" + Math.random().toString(36).slice(2, 12);
    const messagesEl = document.getElementById("messages");
    const form = document.getElementById("chat-form");
    const input = document.getElementById("input");

    function addMessage(role, content, isError) {
      const div = document.createElement("div");
      div.className = "msg " + role + (isError ? " error" : "");
      div.innerHTML = "<div class=\"role\">" + (role === "user" ? "You" : "Agent") + "</div><div class=\"content\">" + escapeHtml(content) + "</div>";
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function escapeHtml(s) {
      const p = document.createElement("p");
      p.textContent = s;
      return p.innerHTML.replace(/\n/g, "<br>");
    }

    function setTyping(on) {
      let el = document.querySelector(".typing");
      if (on && !el) {
        el = document.createElement("div");
        el.className = "msg bot typing";
        el.textContent = "Thinking...";
        messagesEl.appendChild(el);
        messagesEl.scrollTop = messagesEl.scrollHeight;
      } else if (!on && el) el.remove();
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      input.value = "";
      addMessage("user", text);
      setTyping(true);
      try {
        const res = await fetch(API_BASE + "/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ session_id: sessionId, message: text }),
        });
        const data = await res.json();
        setTyping(false);
        if (data.error) addMessage("bot", "Error: " + data.error, true);
        else if (data.reply) addMessage("bot", data.reply);
      } catch (err) {
        setTyping(false);
        addMessage("bot", "Network error: " + err.message, true);
      }
    });
  </script>
</body>
</html>
